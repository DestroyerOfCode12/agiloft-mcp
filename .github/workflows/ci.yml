name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. Pull requests run with the
# default read-only token; no pull_request_target, no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Capability matrix is up to date
        run: pnpm docs:capabilities && git diff --exit-code docs/capability-matrix.md
      - name: Unit and integration tests (embedded PGlite)
        run: pnpm test

  postgres:
    name: Integration tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: agiloft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Approval, execution and worker tests against PostgreSQL
        run: pnpm vitest run packages/core
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/agiloft_test

  build:
    name: Production build and container image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: MCP protocol smoke test (MCP Inspector over stdio)
        run: |
          npx -y @modelcontextprotocol/inspector@2.11.0 --cli \
            -e DATABASE_URL=pglite:memory -e LOG_LEVEL=error --connect-timeout 120000 \
            node apps/mcp-server/dist/stdio.js --method tools/list > tools.json
          node -e "const t=require('./tools.json').tools; if (t.length !== 16) { console.error(t.map(x=>x.name)); process.exit(1) } console.log(t.length + ' tools')"
      - name: Build container image (not pushed)
        run: docker build --tag agiloft-control:ci .

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
